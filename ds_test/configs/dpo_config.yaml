# DPO Smoke Test Configuration
model_name_or_path: "/data/msz/models/Qwen3.5-27B"
data_path: "/data/msz/ds_test/data/smoke_data.jsonl"
output_dir: "/data/msz/ds_test/logs/dpo_output"

# DPO specific
beta: 0.1

# Training parameters
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5e-6
max_seq_length: 512
max_prompt_length: 256

# DeepSpeed配置
deepspeed: "/data/msz/ds_test/configs/ds_config_zero2.json"

# 日志和保存
logging_steps: 1
save_steps: 10
save_total_limit: 1

# 其他
bf16: true
tf32: true
dataloader_num_workers: 0
remove_unused_columns: false
